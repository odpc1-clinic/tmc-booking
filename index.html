  function b64(buf) { return btoa(String.fromCharCode.apply(null, new Uint8Array(buf))); }

  // AES-GCM ห่อเนื้อหา + RSA-OAEP(SHA-1) ห่อกุญแจ — ตัวเดียวกับฟอร์มผูก LINE · server ถอดด้วย TmcBookingCrypto
  async function seal(obj) {
    var pub = await crypto.subtle.importKey('spki', unb64(PUBKEY), { name: 'RSA-OAEP', hash: 'SHA-1' }, false, ['encrypt']);
    var key = await crypto.subtle.generateKey({ name: 'AES-GCM', length: 256 }, true, ['encrypt']);

    var data = await crypto.subtle.encrypt({ name: 'AES-GCM', iv: iv }, key, new TextEncoder().encode(JSON.stringify(obj)));
    var raw = await crypto.subtle.exportKey('raw', key);
    var k = await crypto.subtle.encrypt({ name: 'RSA-OAEP' }, pub, raw);
    return { k: b64(k), iv: b64(iv), d: b64(data) };
  }

      var box = await seal({ persons: ps, name: name, phone: phone, note: $('note').value.trim(), lang: lang });
      var res = await fetch(RELAY, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ date: pick.date, slot: pick.slot, units: unitsOf(ps), dev: dev, box: box,
                               hp: $('website').value, ms: Date.now() - t0, ts: tsToken }) });
      var out = await res.json();
      if (!out.ok) {
        var m = { full: 'eFull', cutoff: 'eCutoff', closed_day: 'eClosedDay', too_many: 'eMany', closed: 'eClosed', bot: 'eBot', too_fast: 'eFast' }[out.error] || 'eSend';
        if (tsWidget !== null) { try { turnstile.reset(tsWidget); } catch (e) {} tsToken = ''; }
        err.textContent = t(m); if (m === 'eFull' || m === 'eCutoff' || m === 'eClosedDay') { pick = { date: '', slot: '' }; loadState(); summary(); }
        return;
      }
      $('doneCode').textContent = out.code;
      var nowD = new Date();
      done = { code: out.code, sum: fmt(t('ticketSum'), { date: dLabel(pick.date), slot: t(pick.slot), people: ps.length }),
               at: fmt(t('ticketNow'), { t: dLabel(ymd(nowD)) + ' ' + ('0' + nowD.getHours()).slice(-2) + ':' + ('0' + nowD.getMinutes()).slice(-2) }) };
      $('doneSum').textContent = done.sum; $('doneNow').textContent = done.at;
      try { var saved = JSON.parse(localStorage.getItem('tmcbk_codes') || '[]'); saved.unshift(out.code); localStorage.setItem('tmcbk_codes', JSON.stringify(saved.slice(0, 5))); } catch (e) {}
      $('stepForm').classList.add('hidden'); $('stepDone').classList.remove('hidden'); window.scrollTo(0, 0);
    } catch (e) {
      err.textContent = t('eSend');
    } finally {
      btn.disabled = false; btn.textContent = t('submit');
    }
  };
  $('again').onclick = function () { location.reload(); };
  var done = null;
  // วาดรหัสจองเป็นรูป PNG ให้ดาวน์โหลด — เผื่อคนที่ไม่ถนัดถ่ายภาพหน้าจอ
  $('saveImg').onclick = function () {
    if (!done) return;
    var c = document.createElement('canvas'), W = 900, H = 520; c.width = W; c.height = H;
    var g = c.getContext('2d'), F = "'IBM Plex Sans Thai', sans-serif";
    g.fillStyle = '#ffffff'; g.fillRect(0, 0, W, H);
    g.fillStyle = '#0f766e'; g.fillRect(0, 0, W, 90);
    g.fillStyle = '#ffffff'; g.font = '600 30px ' + F; g.fillText(lang === 'th' ? 'จองคิววัคซีน สคร.1 เชียงใหม่' : 'Vaccine booking · ODPC1 Chiang Mai', 36, 58);
    g.fillStyle = '#64748b'; g.font = '24px ' + F; g.fillText(t('ticketH'), 36, 150);
    g.fillStyle = '#ccfbf1'; g.fillRect(36, 170, W - 72, 120);
    g.fillStyle = '#0f172a'; g.font = '700 84px ui-monospace, monospace'; g.fillText(done.code, 60, 262);
    g.font = '600 30px ' + F; g.fillText(done.sum, 36, 350);
    g.fillStyle = '#64748b'; g.font = '22px ' + F; g.fillText(done.at, 36, 392);
    g.fillText(lang === 'th' ? 'รอเจ้าหน้าที่ยืนยัน · เช็คผลในเว็บด้วยรหัสจอง · โทร 053-140774' : 'Waiting for confirmation · check status on the website · Tel +66 53 140 774', 36, 450);
    var a = document.createElement('a'); a.download = done.code + '.png'; a.href = c.toDataURL('image/png'); document.body.appendChild(a); a.click(); a.remove();
  };

  $('checkBtn').onclick = function () {
    var c = $('checkCode').value.trim().toUpperCase(), out = $('checkOut');
    if (!c) return;
    out.innerHTML = '<span class="muted">' + esc(t('loading')) + '</span>';
    fetch(RELAY + '?action=status&code=' + encodeURIComponent(c)).then(function (r) { return r.json(); }).then(function (j) {
      if (!j.ok) { out.innerHTML = '<div class="err">' + esc(t('notFound')) + '</div>'; return; }
      var col = { pending: '#ca8a04', confirmed: '#15803d', rejected: '#b91c1c', cancelled: '#64748b', arrived: '#0e7490', no_show: '#7c2d12' }[j.status] || '#64748b';
      out.innerHTML = '<div><b style="font-family:monospace;">' + esc(j.code) + '</b> <span class="pill" style="background:' + col + ';">' + esc(T[lang].st[j.status] || j.status) + '</span></div>'
        + '<div style="margin-top:6px;">' + esc(dLabel(j.date)) + ' · ' + esc(t(j.slot)) + (j.people ? ' · ' + j.people + ' ' + esc(t('persons')) : '') + '</div>'
        + (j.note ? '<div style="margin-top:6px;">📝 ' + esc(j.note) + '</div>' : '')
        + '<div class="muted" style="margin-top:6px;">' + esc((T[lang].stHint || {})[j.status] || '') + '</div>';
    }).catch(function () { out.innerHTML = '<div class="err">' + esc(t('eSend')) + '</div>'; });
  };
  try { var last = JSON.parse(localStorage.getItem('tmcbk_codes') || '[]'); if (last[0]) $('checkCode').value = last[0]; } catch (e) {}

  applyLang();
})();
</script>
</body>
